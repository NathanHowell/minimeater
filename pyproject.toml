[project]
name = "minimeat"
version = "0.1.0"
description = "BGE Large BBQ controller: models, mechanical CAD and tooling"
readme = "README.md"
authors = [
    { name = "Nathan Howell", email = "nathan.d.howell@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
minimeat = "minimeat:main"
minimeat-model = "minimeat.model.report:main"
minimeat-control = "minimeat.model.control_report:main"
minimeat-probes = "minimeat.model.probes_report:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
