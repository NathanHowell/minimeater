[project]
name = "minimeater"
version = "0.1.0"
description = "BGE Large BBQ controller: models, mechanical CAD and tooling"
readme = "README.md"
license = "GPL-3.0-or-later AND CERN-OHL-S-2.0"  # mech/ is hardware (CERN-OHL-S); see LICENSE
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    { name = "Nathan Howell", email = "nathan.d.howell@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.13.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyvista>=0.49.1",
    "scipy>=1.18.1",
]

[project.scripts]
minimeater = "minimeater:main"
minimeater-model = "minimeater.model.report:main"
minimeater-control = "minimeater.model.control_report:main"
minimeater-probes = "minimeater.model.probes_report:main"
minimeater-sim = "minimeater.sim.report:main"
minimeater-fixtures = "minimeater.model.fixtures:main"
minimeater-thermistor-table = "minimeater.model.thermistor_table:main"
mech-export = "minimeater.mech.export:main"
mech-render = "minimeater.mech.views:main"
mech-envelope = "minimeater.mech.envelope:main"
mech-thinwall = "minimeater.mech.thinwall:main"
mech-scene = "minimeater.mech.film:main"
mech-explode = "minimeater.mech.explode:main"
minimeater-cfd = "minimeater.mech.cfd.run:main"
minimeater-pathlines = "minimeater.mech.cfd.pathlines:main"
minimeater-les = "minimeater.mech.cfd.les:main"
minimeater-les-post = "minimeater.mech.cfd.les_post:main"
minimeater-acoustics = "minimeater.mech.cfd.acoustics:main"
minimeater-operating = "minimeater.mech.cfd.operating:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "embreex>=4.4.0.post1",
    "pytest>=9.1.1",
    "trimesh>=5.1.1",
]
models = [
    "easyeda2kicad>=1.0.1",
]
scene = [
    "bpy>=5.2.2",
]
