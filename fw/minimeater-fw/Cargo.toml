[package]
name         = "minimeater-fw"
description  = "minimeater firmware for the ESP32-C6-WROOM-1-N8 (embassy on esp-rtos)"
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[[bin]]
name = "minimeater-fw"
path = "src/bin/main.rs"
test  = false
bench = false

[dependencies]
minimeater-app  = { path = "../minimeater-app" }
minimeater-core = { path = "../minimeater-core" }

esp-hal                = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp32c6", "log-04", "esp-radio", "esp-alloc"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-backtrace          = { version = "0.20.0", features = ["esp32c6", "panic-handler", "println", "custom-halt"] }
esp-println            = { version = "0.18.0", features = ["esp32c6", "log-04"] }
embassy-executor       = { version = "0.10.0", features = ["log"] }
embassy-time           = { version = "0.5.0", features = ["log"] }
esp-radio              = { version = "1.0.0-beta.1", features = ["esp32c6", "wifi", "unstable", "log-04"] }
esp-alloc              = { version = "0.11.0", features = ["esp32c6"] }
embassy-net            = { version = "0.9.1", features = ["dhcpv4", "dhcpv4-hostname", "dns", "mdns", "multicast", "tcp", "udp", "medium-ethernet", "proto-ipv4", "log"] }
esp-storage            = { version = "0.10.0", features = ["esp32c6", "embedded-storage"] }
embassy-embedded-hal   = "0.6.0"
embassy-sync           = "0.8.0"
embedded-io-async      = "0.6.1"
heapless               = "0.9.1"
libm                   = "0.2.16"
nb                     = "1.1.0"
log                    = "0.4.27"
static_cell            = "2.1.1"
rand_core              = { version = "0.6", default-features = false }
embassy-futures        = "0.1.2"
