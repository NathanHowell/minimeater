[package]
name         = "minimeater-app"
description  = "minimeater application logic, generic over the peripheral traits in `hal`; runs on the ESP32-C6 and in the host twin"
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
minimeater-core          = { path = "../minimeater-core" }
embassy-futures        = "0.1.2"
embassy-sync           = "0.7.2"
embassy-time           = "0.5.0"
embedded-hal           = "1.0.0"
embedded-hal-async     = "1.0.0"
embedded-io-async      = "0.6.1"
embedded-storage-async = "0.4.1"
heapless               = "0.9.1"
sequential-storage     = "8.0.2"
log                    = "0.4.27"
libm                   = "0.2.16"
winnow                 = { version = "0.7.13", default-features = false }
sha2                   = { version = "0.11", default-features = false }
pem-rfc7468            = { version = "1.0", default-features = false }

[dev-dependencies]
minimeater-core = { path = "../minimeater-core", features = ["std"] }
serde_json    = "1"
critical-section = { version = "1", features = ["std"] }
embassy-time-driver = "0.2.2"
p256             = { version = "0.13", features = ["ecdsa"] }
x509-cert        = { version = "0.3", features = ["pem"] }
