[package]
name         = "minimeater-core"
description  = "Hardware-independent controller logic: control, probe conversion, protocol. no_std; host-tested."
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[features]
default = []
std     = []

[dependencies]
# Same math on host and target (the C6 has no FPU; everything is soft-float).
libm = "0.2.16"

[dev-dependencies]
serde_json = "1"
