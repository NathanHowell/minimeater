name: ci
on:
  push:
    branches: [master]
  pull_request:

# Each job runs the same recipe a developer runs locally (`just py::ci`, `just fw::ci`, `just hw::check`).
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: uv sync --locked
      - run: just py::ci

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, clippy, rustfmt
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fw
      - uses: extractions/setup-just@v2
      - run: just fw::ci

  hardware:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      # the image has KiCad's stock libraries but no global library tables: seed them from its templates
      - run: |
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/
      - run: just hw::check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: build/hw
