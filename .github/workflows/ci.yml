name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run mech-export build/mech

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fw
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, clippy, rustfmt
          targets: riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fw
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude minimeater-fw --all-targets -- -D warnings
      - run: cargo test --workspace --exclude minimeater-fw --release
      - run: cargo fw-build

  hardware:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      # the image has KiCad's stock libraries but no global library tables: seed them from its templates
      - run: |
          mkdir -p ~/.config/kicad/10.0 build/hw
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/
          kicad-cli sch erc --exit-code-violations --output build/hw/erc.rpt hw/minimeater.kicad_sch
          # errors only: the stock footprints differ between KiCad versions (lib_footprint_mismatch warnings)
          kicad-cli pcb drc --severity-error --exit-code-violations --output build/hw/drc.rpt hw/minimeater.kicad_pcb
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: build/hw
